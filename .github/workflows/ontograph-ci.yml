name: Ontograph CI

on:
  pull_request:
    paths:
      - "ganjoor-ontograph/**"
      - ".github/workflows/ontograph-ci.yml"
  push:
    paths:
      - "ganjoor-ontograph/**"
      - ".github/workflows/ontograph-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: ganjoor-ontograph
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint and format check
        run: |
          python -m ruff check tests/test_u09_ci.py
          python -m ruff format --check tests/test_u09_ci.py

      - name: Build wheel and source distribution
        run: python -m build

      - name: Smoke-test the clean wheel
        run: python -m pytest tests/test_u08_packaging.py -q

      - name: Reconstruct a standalone release
        run: python -m pytest tests/test_release_reconstruction.py -q

      - name: Run the full fixture suite
        run: python -m pytest -q

