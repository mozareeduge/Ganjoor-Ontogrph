[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontograph"
version = "0.1.1"
description = "Governed research apparatus for close and distant reading over the Ganjoor Persian poetry corpus"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/erfanbashar1/persian-poetry-ai-agent-plugin/tree/main/ganjoor-ontograph"
Repository = "https://github.com/erfanbashar1/persian-poetry-ai-agent-plugin"

[project.optional-dependencies]
dev = [
    "build>=1,<2",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
    "tomli>=2,<3; python_version < \"3.11\"",
    # Kept from the CI fix: with `--no-isolation` builds gone, this is now
    # belt-and-suspenders -- nothing in dev depends on setuptools, and a
    # self-sufficient dev environment should not rely on ambient state.
    "setuptools>=68",
]

[project.scripts]
ontograph = "ontograph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
