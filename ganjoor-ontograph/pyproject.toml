[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontograph"
version = "0.1.1"
description = "Ganjoor Ontograph deterministic engine (spec Part IX)"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6,<7",
]

[project.scripts]
ontograph = "ontograph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
